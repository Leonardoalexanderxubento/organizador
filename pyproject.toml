[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "organizador"
version = "0.1.0"
description = "CLI para análise, limpeza e organização inteligente de arquivos."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["typer>=0.12", "rich>=13"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
organizador = "organizador.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
