[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "organizador"
version = "0.2.0"
description = "CLI para análise, limpeza e organização inteligente de arquivos."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["typer>=0.12", "rich>=13", "pydantic>=2", "tomli-w>=1", "send2trash>=1.8"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
organizador = "organizador.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
ignore_missing_imports = true

[tool.ruff.lint.isort]
known-local-folder = ["conftest", "gerar_massa_teste"]
